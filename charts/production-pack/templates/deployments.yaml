{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
spec:
  replicas: {{ $svc.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: {{ $.Release.Name }}-{{ $name }}
  template:
    metadata:
      labels:
        app: {{ $.Release.Name }}-{{ $name }}
    spec:
      {{- if $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml $.Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ $svc.image.repository }}:{{ $svc.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ $svc.containerPort }}
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $.Release.Name }}-secrets
                  key: JWT_SECRET
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $.Release.Name }}-secrets
                  key: {{ $svc.dbSecretKey }}
          {{- range $k, $v := $svc.env }}
            - name: {{ $k }}
              value: "{{ $v }}"
          {{- end }}
          {{- $svcProbes := (default dict $svc.probes) }}
          {{- $enabled := (hasKey $svcProbes "enabled") | ternary $svcProbes.enabled (default true $.Values.probes.enabled) }}
          {{- $path := default (default "/health" $.Values.probes.path) $svcProbes.path }}

          {{- if $enabled }}
          readinessProbe:
            httpGet:
              path: {{ $path }}
              port: {{ $svc.containerPort }}
            initialDelaySeconds: {{ default 5 $.Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ default 5 $.Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ default 2 $.Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ default 6 $.Values.probes.readiness.failureThreshold }}

          livenessProbe:
            httpGet:
              path: {{ $path }}
              port: {{ $svc.containerPort }}
            initialDelaySeconds: {{ default 20 $.Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ default 10 $.Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ default 2 $.Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ default 3 $.Values.probes.liveness.failureThreshold }}
          {{- end }}
{{- end }}
{{- end }}
